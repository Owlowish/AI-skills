name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python workflow/_shared/scripts/check_library.py
      - run: python -m unittest discover -s workflow/3d-reference-to-model/scripts -p "test_*.py"
      - run: python -m unittest discover -s workflow/_shared/tests -p "test_*.py"
